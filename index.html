<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <script defer src="main.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Tip calculator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; margin: 15px 0; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="images/logo.svg" alt="logo Spliter">
    </header>
    <div class="card">
      <div class="first">
      <div class="bill">
      <div>
      <label>Bill</label>
      </div>
      <input type="number" name="bill" id="bills" placeholder="0.00">
      </div>
      <div class="tip">
        <p>Select Tip %</p>
        <div class="tips">
        <button type="button" value="5">5%</button>
        <button type="button" value="10">10%</button>
        <button type="button" value="15">15%</button>
        <button type="button" value="25">25%</button>
        <button type="button" value="50">50%</button>
        <input type="number" name="custom" id="custom" placeholder="Custom">
      </div>
      </div>
      <div class="people">
      <div class="message">
        <label>Number of People</label>
        <span>Can't be zero</span>
      </div>
      <input type="number" name="number-of-people" id="people" placeholder="0">
    </div>
    </div>
      <div class="last-card">
        <div class="tip-amount">
          <div class="text">
          <p>Tip Amount</p>
          <p class="person">/ person</p>
          </div>
          <article>
            $
            <p class="tip-amount-person">0.00</p>
          </article>
        </div>
        <div class="total">
          <div class="text">
          <p>Total</p>
          <p class="person">/ person</p>
          </div>
          <article>
            $
            <p class="total-person">0.00</p>
          </article>
        </div>
    <button type="reset" class="reset-btn">RESET</button>
      </div>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Michael</a>.
  </footer>
</body>
</html>
